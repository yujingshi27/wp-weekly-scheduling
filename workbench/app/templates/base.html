<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span>WP 工作台</div>
    <nav class="nav">
      <a href="/" class="{{ 'active' if active == 'home' else '' }}">待办管理</a>
      <a href="/timesheet" class="{{ 'active' if active == 'timesheet' else '' }}">工时筛选</a>
      <a href="/settings" class="{{ 'active' if active == 'settings' else '' }}">数据源设置</a>
    </nav>
    <div class="today"><span id="today"></span></div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
